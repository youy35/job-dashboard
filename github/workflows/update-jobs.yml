name: Daily Job Radar

on:
  schedule:
    # 北京时间每天上午9点（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update job feed
        run: python scripts/update_jobs.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily job feed"
            git push
          fi
